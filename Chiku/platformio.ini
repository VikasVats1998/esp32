; Chiku robot - two firmwares in one project.
;   pio run -e head   (ESP32-S3 AMOLED head)
;   pio run -e cam    (ESP32-CAM hand box)

[platformio]
default_envs = head

; pioarduino = Arduino core 3.x for ESP32 (pinned)
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wno-unused-variable

[env:head]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = partitions_head.csv
board_build.filesystem = littlefs
build_src_filter = +<head/>
build_flags =
    ${env.build_flags}
    -I include
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_CONF_PATH="${PROJECT_DIR}/include/lv_conf.h"
lib_deps =
    lvgl/lvgl@9.2.2
    moononournation/GFX Library for Arduino@1.5.9
    lewisxhe/SensorLib@0.3.1
    lewisxhe/XPowersLib@0.2.7
    bblanchon/ArduinoJson@7.2.1

[env:cam]
board = esp32cam
board_build.partitions = huge_app.csv
build_src_filter = +<cam/>
build_flags =
    ${env.build_flags}
    -I include
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    bblanchon/ArduinoJson@7.2.1
