; Jinu - desk robot on the Waveshare ESP32-C6-LCD-1.47 (ST7789 172x320, no touch).
;   pio run -e jinu            build
;   pio run -e jinu -t upload  flash (USB-C)
;   pio run -e jinu -t uploadfs  voice clips + web page

[platformio]
default_envs = jinu

[env:jinu]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
board = esp32-c6-devkitc-1
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall -Wno-unused-variable
    -I include
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    moononournation/GFX Library for Arduino@1.6.4
    bblanchon/ArduinoJson@7.2.1
    symlink://../Shared/DeskLink
