; Probe: a measuring tool on an ESP32-S3 Super Mini. It only READS pins (voltage, edges, serial data) so you can
; find out what the electronics of the gimbal / desk handset really do, without a scope or logic analyser.
;   pio run -e probe -t upload
[platformio]
default_envs = probe

[env:probe]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default.csv
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall -Wno-unused-variable
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
