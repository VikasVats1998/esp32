; Gimbal module: ESP32-S3 Super Mini inside the DJI Osmo Mobile SE. It injects joystick and button signals
; (commands come from the handheld remote over ESP-NOW).
;   pio run -e gimbal            build
;   pio run -e gimbal -t upload  flash (USB-C, hold BOOT while plugging in)
[platformio]
default_envs = gimbal

[env:gimbal]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default.csv
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall -Wno-unused-variable
    -I include
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    symlink://../../Chiku/Shared/DeskLink
    symlink://../Shared/RemoteLink
