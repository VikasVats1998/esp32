; ServoTest: test 4-5 servos on a PCA9685 16-channel driver with a plain ESP32 (USB-C dev board).
;   pio run -e servotest -t upload && pio device monitor -b 115200
[platformio]
default_envs = servotest

[env:servotest]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
build_flags = -Wall

; Chiku head board (Waveshare ESP32-S3-Touch-AMOLED-1.75): PCA9685 on GPIO16 (SDA) / GPIO17 (SCL).
; Channels: 1 right foot, 2 right hip, 3 left foot, 4 left hip, 5 neck.
;   pio run -e chiku -t upload --upload-port /dev/ttyACM0
[env:chiku]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
monitor_speed = 115200
build_flags =
    -Wall
    -DCHIKU_MAP
    -DPIN_SDA_CFG=16
    -DPIN_SCL_CFG=17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
